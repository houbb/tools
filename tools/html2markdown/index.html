<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HTML 转 markdown</title>
    <link rel="stylesheet" href="../base.css">
    <style>
        body {
            min-height: 100vh;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Arial', sans-serif;
            background: linear-gradient(135deg, #232526 0%, #414345 100%);
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header {
            width: 100%;
            padding: 24px 0 12px 0;
            display: flex;
            justify-content: flex-start;
            align-items: center;
        }
        .home-btn {
            background: linear-gradient(90deg, #ff8a00 0%, #e52e71 100%);
            color: #fff;
            border: none;
            border-radius: 24px;
            padding: 10px 28px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 2px 8px #222;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-left: 32px;
        }
        .home-btn:hover {
            transform: scale(1.08);
            box-shadow: 0 4px 16px #e52e71;
        }
        .main-card {
            background: rgba(34, 34, 34, 0.92);
            border-radius: 18px;
            box-shadow: 0 4px 32px #222;
            padding: 32px 32px 24px 32px;
            margin-top: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .editor-row {
            display: flex;
            flex-direction: row;
            gap: 32px;
            justify-content: center;
            align-items: flex-start;
            width: 100%;
        }
        .editor-col {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 480px;
            max-width: 98vw;
        }
        .textarea {
            height: 320px;
            width: 100%;
            border-radius: 12px;
            border: none;
            margin: 12px 0;
            padding: 16px;
            font-size: 1.08rem;
            background: #232526;
            color: #fff;
            box-shadow: 0 2px 12px #222;
            resize: vertical;
            transition: box-shadow 0.2s;
        }
        .textarea:focus {
            outline: none;
            box-shadow: 0 4px 24px #e52e71;
        }
    .btn, .swap-btn {
        .copy-icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 6px;
            margin-left: 8px;
            border-radius: 6px;
            transition: background 0.2s;
            display: inline-flex;
            align-items: center;
        }
        .copy-icon-btn:hover {
            background: #414345;
        }
        .copy-icon-btn svg {
            width: 22px;
            height: 22px;
            fill: #43cea2;
            transition: fill 0.2s;
        }
        .copy-icon-btn:hover svg {
            fill: #e52e71;
        }
            background: linear-gradient(90deg, #43cea2 0%, #185a9d 100%);
            color: #fff;
            border: none;
            border-radius: 24px;
            padding: 10px 28px;
            font-size: 1.08rem;
            font-weight: bold;
            cursor: pointer;
            margin: 8px 0;
            box-shadow: 0 2px 8px #222;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn:hover, .copy-btn:hover, .swap-btn:hover {
            transform: scale(1.08);
            box-shadow: 0 4px 16px #43cea2;
        }
        .swap-btn {
            background: linear-gradient(90deg, #e52e71 0%, #ff8a00 100%);
            margin: 0 16px;
            padding: 10px 18px;
            font-size: 1.2rem;
        }
        .editor-actions {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            margin: 12px 0;
            gap: 16px;
        }
        .footer {
            margin-top: 60px;
            text-align: center;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 18px;
        }
        .footer-text {
            text-align: center;
            font-size: 1.18rem;
            margin-bottom: 10px;
        }
        .footer-img {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 32px;
        }
        .footer-img img:first-child {
            width: 220px;
            max-width: 260px;
            min-width: 120px;
            border-radius: 12px;
            box-shadow: 0 2px 16px #222;
        }
        .footer-img img:last-child {
            width: 180px;
            max-width: 220px;
            min-width: 100px;
            border-radius: 12px;
            box-shadow: 0 2px 16px #222;
        }
        @media (max-width: 1100px) {
            .editor-row {
                flex-direction: column;
                gap: 0;
                align-items: stretch;
            }
            .editor-col {
                width: 98vw;
                max-width: 98vw;
            }
        }
        @media (max-width: 900px) {
            .main-card {
                padding: 16px 4px;
            }
            .footer-img img {
                width: 120px !important;
                min-width: 80px !important;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <button class="home-btn" onclick="window.location.href='https://houbb.github.io'">返回首页</button>
    </div>
    <div class="main-card">
        <div class="editor-row">
            <div class="editor-col">
                <label for="original" style="font-weight:bold;">HTML输入</label>
                <textarea class="textarea" id="original" placeholder="请输入HTML"></textarea>
                <button class="copy-icon-btn" onclick="copyToClipboard('original')" title="复制">
                    <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
                </button>
            </div>
            <div class="editor-actions">
                <button class="swap-btn" title="交换左右内容" onclick="swapContent()">⇄</button>
            </div>
            <div class="editor-col">
                <label for="format" style="font-weight:bold;">Markdown输出</label>
                <textarea class="textarea" id="format" placeholder="格式化后的内容"></textarea>
                <button class="copy-icon-btn" onclick="copyToClipboard('format')" title="复制">
                    <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
                </button>
            </div>
        </div>
        <div class="editor-actions">
            <button class="btn" onclick="toMarkdown()">HTML转Markdown</button>
            <button class="btn" onclick="toHtml()">Markdown转HTML</button>
        </div>
    </div>
    <div class="footer">
        <div class="footer-text">技术改变世界，思考引领未来</div>
        <div class="footer-img">
            <img src="https://houbb.github.io/tools/lmxxf_logo.png" alt="lmxxf logo">
            <img src="https://houbb.github.io/tools/lmxxf_reword.png" alt="lmxxf reward">
        </div>
    </div>
    <script type="text/javascript" src="markdown_dom_parser.js"></script>
    <script type="text/javascript" src="html2markdown.js"></script>
    <!-- 引入 marked.js 用于 markdown 转 html -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        function toMarkdown() {
            var html = $('original').value;
            $("format").value = html2markdown(html);
        }
        function toHtml() {
            var md = $('format').value;
            $("original").value = marked.parse(md);
        }
        function $(id) {
            return document.getElementById(id);
        }
        function copyToClipboard(id) {
            var el = $(id);
            el.select();
            document.execCommand('copy');
        }
        function swapContent() {
            var left = $('original').value;
            var right = $('format').value;
            $('original').value = right;
            $('format').value = left;
        }
    </script>
</body>
</html>
