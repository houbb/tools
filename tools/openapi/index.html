<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OpenAPI → Redoc HTML 生成器</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <style>
    body { padding: 2rem; background: #f9fafb; font-family: "Inter", "Roboto", "Helvetica", sans-serif; }
    h1 { font-size: 1.6rem; font-weight: 600; margin-bottom: 1rem; color: #0b5cff; }
    textarea { font-family: monospace; resize: vertical; }
    .footer { font-size: 0.9rem; color: #666; margin-top: 2rem; text-align: center; }
    #alertBox { display:none; position: fixed; top: 20px; right: 20px; z-index: 9999; min-width: 300px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🧩 OpenAPI → Redoc 文档生成工具</h1>
    <p>你可以输入 OpenAPI JSON/YAML 内容，或从 URL 加载，再验证或生成 Redoc HTML 文件。</p>

    <div class="mb-3">
      <label class="form-label fw-semibold">OpenAPI 地址：</label>
      <div class="input-group">
        <input type="text" id="apiUrl" class="form-control" value = "http://localhost:8080/v3/api-docs" placeholder="例如：http://localhost:8080/v3/api-docs" />
        <button id="btnLoad" class="btn btn-primary">加载</button>
        <button id="btnClear" class="btn btn-outline-secondary">清空</button>
      </div>
    </div>

    <div class="mb-3">
      <label class="form-label fw-semibold">或直接输入 OpenAPI 内容：</label>
      <textarea id="specText" rows="18" class="form-control" placeholder="输入或粘贴 OpenAPI JSON / YAML ..."></textarea>
      <div class="form-text">检测格式：<span id="detectedType" class="fw-semibold text-primary">未检测</span></div>
    </div>

    <div class="mb-3">
      <button id="btnValidate" class="btn btn-success me-2">验证规范</button>
      <button id="btnDownload" class="btn btn-danger">生成并下载 HTML</button>
    </div>
  </div>

  <div id="alertBox" class="alert" role="alert"></div>
  <div class="footer">© 2025 OpenAPI Redoc 生成器</div>

  <!-- 引入 YAML 解析器 + 工具脚本 -->
  <script src="https://cdn.jsdelivr.net/npm/js-yaml@4/dist/js-yaml.min.js"></script>
  <script src="generator.js"></script>
</body>
</html>
