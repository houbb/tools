<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>诺基亚屏幕文字生成器</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(135deg, #0f2027 0%, #2c5364 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: 'Segoe UI', 'Roboto', 'Arial', sans-serif;
        }
        .container {
            display: flex;
            gap: 40px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: flex-start;
        }
        .phone {
            background: #1a1a1a;
            border-radius: 30px;
            padding: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }
        .phone-screen {
            background: #84b818;
            width: 280px;
            height: 400px;
            border-radius: 8px;
            padding: 15px;
            position: relative;
            overflow: hidden;
            border: 4px solid #2a2a2a;
        }
        .phone-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 10px;
            color: #000;
            font-weight: bold;
        }
        .phone-content {
            background: #a8d840;
            height: 320px;
            overflow-y: auto;
            padding: 10px;
            border: 2px solid #6b9e1a;
            font-size: 12px;
            line-height: 1.6;
            color: #000;
            font-family: 'Courier New', monospace;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .phone-content::-webkit-scrollbar {
            width: 6px;
        }
        .phone-content::-webkit-scrollbar-track {
            background: #6b9e1a;
        }
        .phone-content::-webkit-scrollbar-thumb {
            background: #4a7a0a;
            border-radius: 3px;
        }
        .controls {
            background: linear-gradient(135deg, #232526 0%, #414345 100%);
            border-radius: 18px;
            padding: 25px;
            min-width: 320px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.25);
        }
        .controls h2 {
            color: #00e6e6;
            margin-bottom: 20px;
            font-size: 1.3rem;
        }
        .control-group {
            margin-bottom: 15px;
        }
        .control-group label {
            display: block;
            color: #e0e0e0;
            margin-bottom: 5px;
            font-size: 0.95rem;
        }
        .control-group textarea {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #222;
            color: #fff;
            font-size: 1rem;
            min-height: 120px;
            resize: vertical;
            font-family: inherit;
        }
        .control-group textarea:focus {
            outline: none;
            box-shadow: 0 0 0 2px #00e6e6;
        }
        .control-group input[type="range"] {
            width: 100%;
            margin-top: 5px;
        }
        .control-group select {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 8px;
            background: #222;
            color: #fff;
            font-size: 1rem;
        }
        .control-group select:focus {
            outline: none;
            box-shadow: 0 0 0 2px #00e6e6;
        }
        .screen-theme {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .theme-btn {
            width: 50px;
            height: 50px;
            border-radius: 8px;
            border: 3px solid transparent;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: #000;
            font-weight: bold;
        }
        .theme-btn:hover {
            transform: scale(1.1);
        }
        .theme-btn.active {
            border-color: #00e6e6;
        }
        .theme-green {
            background: #84b818;
        }
        .theme-blue {
            background: #4a90d9;
        }
        .theme-orange {
            background: #f39c12;
        }
        .theme-white {
            background: #ecf0f1;
        }
        .theme-yellow {
            background: #f1c40f;
        }
        .theme-purple {
            background: #9b59b6;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-primary {
            background: #00e6e6;
            color: #222;
            font-weight: 600;
        }
        .btn-primary:hover {
            background: #fff;
            color: #00e6e6;
        }
        .btn-secondary {
            background: #444;
            color: #fff;
        }
        .btn-secondary:hover {
            background: #555;
        }
        .preset-texts {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }
        .preset-btn {
            padding: 6px 12px;
            background: #333;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        .preset-btn:hover {
            background: #444;
        }
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
                align-items: center;
            }
            .controls {
                width: 100%;
                min-width: 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="phone">
            <div class="phone-screen" id="phoneScreen">
                <div class="phone-header">
                    <span id="phoneTime">12:00</span>
                    <span id="phoneDate">01/01/24</span>
                </div>
                <div class="phone-content" id="screenContent">
在此输入文字...
                </div>
            </div>
        </div>

        <div class="controls">
            <div style="display:flex;align-items:center;gap:16px;margin-bottom:20px;">
                <h2 style="margin:0;"><i class="fa fa-mobile-alt"></i> 诺基亚屏幕文字生成器</h2>
                <a href="https://houbb.github.io/tools/" target="_self" style="color:#00e6e6;text-decoration:none;font-size:14px;">⬅ 返回首页</a>
            </div>
            
            <div class="control-group">
                <label>输入文字内容</label>
                <textarea id="textInput" placeholder="在此输入要显示的文字...">在此输入文字...</textarea>
            </div>

            <div class="control-group">
                <label>屏幕主题</label>
                <div class="screen-theme">
                    <div class="theme-btn theme-green active" data-theme="green" onclick="setTheme('green')">经典绿</div>
                    <div class="theme-btn theme-blue" data-theme="blue" onclick="setTheme('blue')">蓝色</div>
                    <div class="theme-btn theme-orange" data-theme="orange" onclick="setTheme('orange')">橙色</div>
                    <div class="theme-btn theme-white" data-theme="white" onclick="setTheme('white')">白色</div>
                    <div class="theme-btn theme-yellow" data-theme="yellow" onclick="setTheme('yellow')">黄色</div>
                    <div class="theme-btn theme-purple" data-theme="purple" onclick="setTheme('purple')">紫色</div>
                </div>
            </div>

            <div class="control-group">
                <label>字体大小: <span id="fontSizeValue">12px</span></label>
                <input type="range" id="fontSize" min="8" max="24" value="12" onchange="updateFontSize()">
            </div>

            <div class="control-group">
                <label>预设文字</label>
                <div class="preset-texts">
                    <button class="preset-btn" onclick="setPreset('hello')">Hello World</button>
                    <button class="preset-btn" onclick="setPreset('love')">表白</button>
                    <button class="preset-btn" onclick="setPreset('poem')">诗歌</button>
                    <button class="preset-btn" onclick="setPreset('code')">代码</button>
                    <button class="preset-btn" onclick="setPreset('ascii')">ASCII艺术</button>
                </div>
            </div>

            <div class="btn-group">
                <button class="btn btn-primary" onclick="generateText()">生成</button>
                <button class="btn btn-secondary" onclick="exportImage()">导出图片</button>
            </div>
        </div>
    </div>

    <script>
        const themes = {
            green: {
                screen: '#84b818',
                content: '#a8d840',
                border: '#6b9e1a',
                text: '#000'
            },
            blue: {
                screen: '#4a90d9',
                content: '#6ba3e0',
                border: '#2d6cb5',
                text: '#000'
            },
            orange: {
                screen: '#f39c12',
                content: '#f5b041',
                border: '#d68910',
                text: '#000'
            },
            white: {
                screen: '#ecf0f1',
                content: '#ffffff',
                border: '#bdc3c7',
                text: '#2c3e50'
            },
            yellow: {
                screen: '#f1c40f',
                content: '#f4d03f',
                border: '#d4ac0d',
                text: '#000'
            },
            purple: {
                screen: '#9b59b6',
                content: '#af7ac5',
                border: '#7d3c98',
                text: '#000'
            }
        };

        const presets = {
            hello: `Hello World!
这是诺基亚屏幕
经典显示效果

欢迎使用！`,
            love: `我喜欢你
就像诺基亚
经典而永恒

❤️`,
            poem: `静夜思
床前明月光
疑是地上霜
举头望明月
低头思故乡

——李白`,
            code: `#include <stdio.h>

int main() {
    printf("Hello Nokia!");
    return 0;
}`,
            ascii: `   ___
  /   \\
 |  O  |
  \\___/
  Nokia`
        };

        let currentTheme = 'green';

        function updateTime() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const year = String(now.getFullYear()).slice(-2);
            
            document.getElementById('phoneTime').textContent = `${hours}:${minutes}`;
            document.getElementById('phoneDate').textContent = `${day}/${month}/${year}`;
        }

        function setTheme(theme) {
            currentTheme = theme;
            const screen = document.getElementById('phoneScreen');
            const content = document.getElementById('screenContent');
            const themeData = themes[theme];

            screen.style.background = themeData.screen;
            content.style.background = themeData.content;
            content.style.borderColor = themeData.border;
            content.style.color = themeData.text;

            document.querySelectorAll('.theme-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.dataset.theme === theme) {
                    btn.classList.add('active');
                }
            });
        }

        function updateFontSize() {
            const size = document.getElementById('fontSize').value;
            document.getElementById('fontSizeValue').textContent = size + 'px';
            document.getElementById('screenContent').style.fontSize = size + 'px';
        }

        function generateText() {
            const text = document.getElementById('textInput').value;
            document.getElementById('screenContent').textContent = text;
        }

        function setPreset(preset) {
            const text = presets[preset];
            document.getElementById('textInput').value = text;
            generateText();
        }

        function exportImage() {
            if (typeof html2canvas === 'undefined') {
                alert('导出功能需要加载html2canvas库，请检查网络连接');
                return;
            }
            const phone = document.querySelector('.phone');
            html2canvas(phone, {
                backgroundColor: null,
                scale: 2
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'nokia-screen.png';
                link.href = canvas.toDataURL();
                link.click();
            }).catch(err => {
                console.error('导出失败:', err);
                alert('导出失败，请重试');
            });
        }

        document.getElementById('textInput').addEventListener('input', function() {
            generateText();
        });

        updateTime();
        setInterval(updateTime, 1000);
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</body>
</html>
