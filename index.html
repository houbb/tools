function renderCards(filterText = '', filterCategory = '') {
	const flow = document.getElementById('cardFlow');
	flow.innerHTML = '';
	const keyword = filterText.trim().toLowerCase();
	tools.filter(tool => {
		const matchCategory = !filterCategory || tool.category === filterCategory;
		const matchKeyword = !keyword || (
			tool.title.toLowerCase().includes(keyword) ||
			tool.subtitle.toLowerCase().includes(keyword) ||
			tool.desc.toLowerCase().includes(keyword) ||
			tool.category.toLowerCase().includes(keyword)
		);
		return matchCategory && matchKeyword;
	}).forEach(tool => {
		const card = document.createElement('div');
		card.className = 'tool-card';
		card.innerHTML = `
			<div class="category">${tool.category}</div>
			<div class="title" style="margin-top:10px;"><i class="fa ${tool.icon}" style="margin-right:8px;color:#00e6e6;"></i>${tool.title}</div>
			<div class="subtitle">${tool.subtitle}</div>
			<div class="desc">${tool.desc}</div>
			<a class="goto" href="${tool.url}" target="_blank">进入</a>
		`;
		flow.appendChild(card);
	});
}

document.getElementById('searchInput').addEventListener('input', function() {
	renderCards(this.value, document.getElementById('categorySelect').value);
});
document.getElementById('categorySelect').addEventListener('change', function() {
	renderCards(document.getElementById('searchInput').value, this.value);
});

window.onload = function() {
